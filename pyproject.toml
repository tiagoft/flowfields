[project]
name = "flowfields"
version = "0.1.11"
description = "Tools for artwork by composing flow fields"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tiago Tavares" }]
keywords = [
    "generative art",
    "flow field",
    "vector field",
    "creative coding",
    "p5.js",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/tiagoft/flowfields"
Source = "https://github.com/tiagoft/flowfields"
Issues = "https://github.com/tiagoft/flowfields/issues"
Demos = "https://github.com/tiagoft/flowfields/blob/main/demos/README.md"
Author = "https://tiagoft.github.io"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7",
]

[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/"]

[dependency-groups]
dev = [
    "matplotlib>=3.7",
    "pycairo>=1.29.0",
    "pytest>=8",
    "tqdm>=4.67.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
