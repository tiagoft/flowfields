[project]
name = "flowfields"
version = "0.1.1"
description = "Tools for artwork by composing flow fields"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pillow>=11.2.1",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/"]

[dependency-groups]
dev = [
    "pycairo>=1.29.0",
    "tqdm>=4.67.1",
]

