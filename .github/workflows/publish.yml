name: publish

# Pushing a tag such as v0.2.0 publishes that version to PyPI and to npm. The
# tag must match the version in pyproject.toml and js/package.json.
# Publishing uses trusted publishing: PyPI and npm each list this workflow,
# with the environment named in its job, as a trusted publisher, so no token
# is stored.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but pyproject.toml has version $version"
            exit 1
          fi

      - name: Tests
        run: uv run --locked --no-group artwork pytest -q

      - name: Build
        run: uv build

      - name: Check the metadata and the README
        run: uvx twine check --strict dist/*

      - name: Install the wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/check"
          uv pip install --python "$RUNNER_TEMP/check" dist/*.whl
          cd "$RUNNER_TEMP"
          check/bin/python -I -c "import flowfields as ff; assert ff.__version__ == '${GITHUB_REF_NAME#v}', ff.__version__"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flowfields
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/flowfields
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: The tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but js/package.json has version $version"
            exit 1
          fi

      - name: Tests
        run: |
          npm ci
          npm test

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest

      # prepack copies the LICENSE in; provenance is added automatically
      - name: Publish
        run: npm publish
